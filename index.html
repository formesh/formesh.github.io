<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水墨风格着陆页</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1a1a1a'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Ma Shan Zheng', cursive;
            background: #f8f8f8;
            color: #1a1a1a;
            overflow: hidden;
        }

        /* ================== 背景云雾 ================== */
        .ink-background {
            position: absolute;
            inset: 0;
            background-image: url('./bg.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .ink-background::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: inherit;
            background-size: cover;
            opacity: 0.3;
            animation: mistMove 30s linear infinite;
        }

        @keyframes mistMove {
            0%   { transform: scale(1) translateX(0); }
            50%  { transform: scale(1.05) translateX(-30px); }
            100% { transform: scale(1) translateX(0); }
        }

        /* ================== 页面进入 ================== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-enter {
            animation: fadeUp 1.2s ease-out forwards;
        }

        /* ================== 标题动画 ================== */
        .calligraphy-title {
            font-size: 48px;
            letter-spacing: 4px;
            animation: floatSlow 6s ease-in-out infinite;
        }

        @keyframes floatSlow {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        /* ================== 按钮 ================== */
        .seal-button {
            background: linear-gradient(135deg, #1a1a1a, #333);
            border: 2px solid #1a1a1a;
            box-shadow: 0 6px 12px rgba(0,0,0,.3);
        }

        @keyframes inkShine {
            0% { transform: translateX(-120%) skewX(-12deg); }
            100% { transform: translateX(120%) skewX(-12deg); }
        }

        .shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.35),
                transparent
            );
            animation: inkShine 3s infinite;
        }

        /* ================== 客服 ================== */
        .floating-chat {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            animation: breathe 2.5s infinite;
        }

        @keyframes breathe {
            0%   { box-shadow: 0 0 0 0 rgba(0,0,0,.5); }
            70%  { box-shadow: 0 0 0 16px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }

        /* ================== 点击墨迹 ================== */
        @keyframes inkSpread {
            to {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }

        .ink {
            position: absolute;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: inkSpread .6s ease-out forwards;
            pointer-events: none;
        }

        .r-text {
            position: fixed;
            right: 0;
            top: 1rem;
            width: 80px;
        }
    </style>
</head>

<body>

<!-- 背景 -->
<div class="ink-background"></div>

<!-- 内容 -->
<div class="relative z-10 h-screen flex flex-col items-center justify-center text-center px-8 page-enter">
    <div class="r-text">
        <img src="./text.png" alt="">
    </div>
    <h1 class="calligraphy-title mb-16">
        让一切不可能变成可能
    </h1>

    <button class="seal-button relative overflow-hidden rounded-xl text-white px-12 py-5 text-xl font-bold group">
        <span class="relative z-10 flex items-center">
            <i class="fas fa-brush mr-3 text-2xl"></i>
            点击继续访问
        </span>
        <span class="shine"></span>
    </button>

    <p class="mt-12 text-lg text-gray-700 max-w-2xl leading-relaxed">
        探索无限可能的世界，体验前所未有的创新之旅。
        我们致力于打破常规，创造令人惊叹的未来。
    </p>

</div>

<!-- 客服 -->
<div class="floating-chat">
    <i class="fas fa-headset text-white text-xl"></i>
</div>

<!-- JS -->
<script>
    document.querySelector('.seal-button').addEventListener('click', function (e) {
        const ink = document.createElement('span');
        ink.className = 'ink';
        ink.style.left = e.offsetX + 'px';
        ink.style.top = e.offsetY + 'px';
        ink.style.width = ink.style.height = '20px';
        this.appendChild(ink);
        setTimeout(() => ink.remove(), 600);
    });
</script>

</body>
</html>
