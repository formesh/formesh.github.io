<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证结果</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .container { height: 100dvh; width: 100%; padding: 1rem; background: linear-gradient(180deg, rgba(232,243,255,0.5) 0%, #FFFFFE 100%); }
        .result { height: 40%; width: 100%; display: flex; justify-content: center; align-items: center; }
        .message { color: #1D2129; line-height: 28px; text-align: center; font-size: 15px; }
        .button { margin-top: 48px; display: flex; justify-content: center; align-items: center; }
        button { display: none; width: 160px; height: 40px; background: #F6F6F6; border-radius: 6px; border: 1px solid #E5E7EA; color: #1D2129; cursor: pointer; }
        button:hover { background: #E5E7EA; }
        .circle.success { border-color: #52c41a; }
        .circle.warning { border-color: #faad14; }
        .circle.error { border-color: #f5222d; }
    </style>
</head>
<body>
    <div class="container">
      <div class="result">
      </div>
      <div class="message">
      </div>
      <div class="button">
        <button onclick="goSystem()">前往系统</button>
      </div>
    </div>
    <script>
      const goSystem = () => {
        window.location.href = 'https://171.221.206.27:8091';
      }
      // 判断是否pc端
      const isPC = () => {
        const userAgentInfo = navigator.userAgent;
        const Agents = ["Android", "iPhone", "SymbianOS", "Windows Phone", "iPad", "iPod"];
        let flag = true;
        for (let v = 0; v < Agents.length; v++) {
          if (userAgentInfo.indexOf(Agents[v]) > 0) {
            flag = false;
            break;
          }
        }
        return flag;
      }

      // 如果是pc端，显示按钮
      if (isPC()) {
        document.querySelector('button').style.display = 'block';
      }

      // 获取url response参数
      const getUrlParams = () => {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('response');
      }
      const raw = getUrlParams();
      const jsonString = decodeURIComponent(raw || '');
      let data = {};
      try { data = JSON.parse(jsonString); } catch {}

      const map = {
        '1000': { status: 'success', message: '人脸识别录入成功，返回系统即可使用' },
        '1003': {
          status: 'error',
          default: '刷脸频次过高或失败次数过多，请稍候再试',
          sub: {
            'H1001': '刷脸频次过高或失败次数过多，请稍候再试',
            'H2007': 'API 限流中',
            'H5000': '用户切出当前页面',
            'H5052': '网络异常，需要提供 certify_id 查询日志',
            'H5053': '初始化失败',
            'H5054': '摄像头打开失败，常见为无摄像头权限',
            'H5055': '用户取消了业务流程，已退出',
            'H5056': '刷脸重试次数超过限制'
          }
        },
        '2006': {
          status: 'error',
          default: '刷脸失败',
          sub: { 'H5057': '刷脸失败，实际结果需通过服务端查询接口进行结果查询' }
        }
      };

      function resolveState(c, s) {
        const conf = map[c];
        if (!conf) return { status: 'error', message: '未知状态' };
        const msg = (conf.sub && s && conf.sub[s]) ? conf.sub[s] : (conf.message || conf.default);
        return { status: conf.status, message: msg };
      }

      let state;
      if (data && (data.code !== undefined)) {
        state = resolveState(String(data.code), String(data.subCode || ''));
      } else if (data && data.status === 'SUCCESS') {
        state = { status: 'success', message: '人脸识别录入成功，返回系统即可使用' };
      } else {
        state = { status: 'error', message: '人脸识别录入失败，请重试' };
      }

      document.querySelector('.result').innerHTML = `<img src="/${state.status}.png" alt="${state.status}">`;
      document.querySelector('.message').textContent = state.message || state.sub[state.subCode || ''];
    </script>
</body>
</html>
